
name: Build Mind Match APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Mind_Match_Android_Studio_Project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -o Mind_Match_Android_Studio_Project.zip -d .

      - name: Build APK
        run: gradle -p MindMatchAndroid assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Mind-Match-APK
          path: MindMatchAndroid/app/build/outputs/apk/debug/app-debug.apk
